<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            padding-bottom: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }
        .status {
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* The Big Box (Form Container) */
        .big-box {
            width: 85%;
            max-width: 600px;
            padding: 40px;
            background-color: #ffffff;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Form Input Styling */
        .input-field {
            padding: 12px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            outline: none;
        }

        .input-field:focus {
            background-color: #f0f8ff;
        }

        /* Submit Button (Small Box style) */
        .submit-btn {
            margin-top: 10px;
            padding: 15px;
            background-color: #333;
            color: white;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        .btn-home {
            margin-top: 30px;
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="status">Create New User</div>

    <div class="big-box">
        <form action="{{ url_for("db_create")}}" method="POST" id="userForm" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="name" class="input-field" placeholder="First Name" required>
            <input type="text" name="surname" class="input-field" placeholder="Surname" required>
            <input type="email" name="email" class="input-field" placeholder="E-mail Address" required>
            <input type="password" name="password" class="input-field" placeholder="Password" required>
            <input type="text" name="address" class="input-field" placeholder="Home Address">
            <input type="text" name="telephone_num" class="input-field" placeholder="Telephone Number">

            <button type="submit" class="submit-btn">Register User</button>
        </form>
    </div>

    <a href="/" class="btn-home">← Back to Dashboard</a>



</body>
</html>
