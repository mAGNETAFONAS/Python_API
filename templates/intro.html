<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Manager</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }
        .status {
            font-size: 2.5rem;
            margin-bottom: 40px;
            font-weight: bold;
        }
        /* Container for the buttons */
        .button-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        /* Using your .small-box style for clickable service buttons */
        .service-btn {
            padding: 20px;
            width: 250px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1.2rem;
            text-align: center;
            background-color: #fff;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: all 0.2s ease;
            display: block;
        }
        .service-btn:hover {
            background-color: #333;
            color: #fff;
            transform: translateY(-2px);
        }


    </style>
</head>
<body>

    <div class="status">Server is running</div>

    <div class="button-container">
        <a href="/web" class="service-btn">File Service</a>
        <a href="/db" class="service-btn">Database Service</a>
    </div>


</body>
</html>
