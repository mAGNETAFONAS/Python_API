
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Service</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Page Title */
        .status {
            font-size: 2.5rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Login Box */
        .login-box {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            background-color: #ffffff;
            border: 4px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 35px;
        }

        .login-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Input Fields */
        .input-box {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .input-box:focus {
            background-color: #fafafa;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }

        .login-btn:hover {
            background-color: #555;
        }

        /* Info Box */
        .info-box {
            width: 85%;
            max-width: 600px;
            padding: 20px;
            background-color: #eee;
            border: 2px dashed #333;
            border-radius: 5px;
        }

        .info-header {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            display: inline-block;
        }

        .info-items {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .info-items li {
            font-family: monospace;
            padding: 5px 0;
            color: #555;
        }

        /* Back Link */
        .btn-home {
            margin-top: 30px;
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
        }

        .message {
            margin-bottom: 20px;
            font-weight: bold;
            color: #444;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="status">Login Service</div>

    <div class="login-box">
        <div class="login-header">User Authentication</div>

        <div class="message">
            {{ msg }}
        </div>

        <form method="POST" action="{{ url_for("db_login")}}">
            <input
                type="text"
                name="name"
                class="input-box"
                placeholder="Enter Username"
                required
                autocomplete="off"
            >

            <input
                type="password"
                name="password"
                class="input-box"
                placeholder="Enter Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>
    </div>

    <a href="/" class="btn-home">← Back to Dashboard</a>

</body>
</html>
