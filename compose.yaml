
services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: python_api_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    ports:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 2s
      retries: 25

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: python_api_web:${COMPOSE_VERSION}
    depends_on:
       db:
          condition: service_healthy
          restart: true
    container_name: web_app
    env_file:
      - .env
    volumes:
      - ./files/:/app/files
    ports:
      - "8000:8000"
    networks:
      - app_network

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge
