apiVersion: v1
data:
  init.sql: |2-
    USE web;

    CREATE TABLE users (
        id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(255),
        surname VARCHAR(255),
        password VARCHAR(255),
        address VARCHAR(255),
        telephone_num VARCHAR(20),
        email VARCHAR(255)
    );
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  name: db-cm1
