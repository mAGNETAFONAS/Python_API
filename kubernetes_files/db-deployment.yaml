apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: db
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: db
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: web
            - name: MYSQL_PASSWORD_FILE
              value: /run/secrets/user-pass
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /run/secrets/root-pass
            - name: MYSQL_USER
              value: simas
          image: mysql:9.6.0
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            failureThreshold: 25
            timeoutSeconds: 2
          name: python-api-db
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /run/secrets/root-pass
              name: root-pass
              subPath: root-pass
            - mountPath: /run/secrets/user-pass
              name: user-pass
              subPath: user-pass
            - mountPath: /var/lib/mysql
              name: db-data
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: db-cm1
              subPath: init.sql
      restartPolicy: Always
      volumes:
        - name: root-pass
          secret:
            items:
              - key: root-pass
                path: root-pass
            secretName: root-pass
        - name: user-pass
          secret:
            items:
              - key: user-pass
                path: user-pass
            secretName: user-pass
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
        - configMap:
            items:
              - key: init.sql
                path: init.sql
            name: db-cm1
          name: db-cm1
